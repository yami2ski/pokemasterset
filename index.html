<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>PokéMaster Set</title>
<style>
:root{--bg:#12163a;--pn:#1c2255;--ac:#ffcb05;--rd:#e63946;--bl:#3b5ba7;--tx:#f1f3ff;--mu:#9aa5d6}
*{box-sizing:border-box}
body{margin:0;font-family:"Avenir Next",Avenir,"Trebuchet MS",sans-serif;background:radial-gradient(circle at 15% -10%,#2c3a99,var(--bg) 55%) fixed;color:var(--tx);min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:#0a0d26dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
h1{font-size:21px;margin:0 auto 0 0;color:var(--ac);letter-spacing:.5px}
button,select,input[type=text]{font:inherit;border:0;border-radius:10px;padding:8px 14px}
button{background:var(--ac);color:#1b1b1b;font-weight:700;cursor:pointer}
button.g{background:#2b3478;color:var(--tx)}button.on{outline:2px solid var(--ac)}button:disabled{opacity:.4}
button:focus-visible,select:focus-visible{outline:3px solid #fff}
.coins{background:#0008;padding:7px 14px;border-radius:20px;font-weight:700}
main{max-width:1200px;margin:0 auto;padding:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar input[type=text]{flex:1;min-width:200px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.set{background:var(--pn);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.set img{height:70px;max-width:100%;object-fit:contain}.set h3{margin:0;font-size:15px}.set small,.note{color:var(--mu)}
.set button{margin-top:auto;width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}
.tc{position:relative;cursor:pointer;font-size:11px;text-align:center}
.tc img,.ph{width:100%;aspect-ratio:63/88;border-radius:6px;object-fit:cover;background:#0006;display:block}
.tc.off img{filter:grayscale(1);opacity:.3}.tc.off .ph{opacity:.4}
.tc em{position:absolute;top:4px;right:4px;background:var(--rd);border-radius:10px;padding:1px 7px;font-style:normal;font-weight:700}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:6px;font-size:12px}
.pb{width:min(360px,80vw);height:10px;background:#0006;border-radius:6px;overflow:hidden;margin:10px auto}.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.err{background:#5a1a28;padding:20px;border-radius:12px;text-align:center}
.hidden{display:none!important}
#stage{position:fixed;inset:0;z-index:20;background:rgba(8,10,28,.97);display:flex;align-items:center;justify-content:center;overflow:auto;transition:background 1s}
#stage.dim{background:#000}
.sbox{text-align:center;padding:20px;position:relative}.x{position:absolute;top:14px;right:14px;z-index:3}
.pack{width:220px;height:340px;position:relative;cursor:pointer;margin:0 auto 18px;animation:fl 3s ease-in-out infinite}
.pack .body{position:absolute;inset:44px 0 0;background:linear-gradient(160deg,var(--bl),#7a2fa3);border-radius:0 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-shadow:0 20px 50px #000a}
.pack img{max-width:90%;max-height:90px;object-fit:contain}
.pack .top{position:absolute;inset:0 0 auto;height:48px;background:repeating-linear-gradient(90deg,#e4e4e4 0 6px,#aaa 6px 12px);border-radius:14px 14px 0 0;transform-origin:0 100%;z-index:2}
.pack.tear{animation:none}.pack.tear .top{animation:tear .9s forwards}.pack.tear .body{animation:glow .9s}
@keyframes fl{50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes tear{to{transform:translate(70px,-130px) rotate(35deg);opacity:0}}
@keyframes glow{50%{filter:brightness(2.5)}}
.cw{position:relative;display:inline-block}.cw.shake{animation:shake .12s infinite}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.flip{width:min(300px,68vw);aspect-ratio:63/88;perspective:1100px;cursor:pointer}
.last .flip{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.04);filter:drop-shadow(0 0 18px #fff)}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s}
.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4.5%;overflow:hidden}
.face img,.face .ph{width:100%;height:100%;border-radius:0}
.back{background:radial-gradient(circle,var(--ac) 0 11%,#1a2470 12% 100%),#1a2470;border:6px solid var(--ac)}
.front{transform:rotateY(180deg);background:#0008}
.shine{position:absolute;inset:0;pointer-events:none;opacity:0}
.fx-AR .shine,.fx-SAR .shine,.fx-secret .shine{opacity:1;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,#fffc 50%,transparent 70%);background-size:260% 100%;animation:sh 2.2s linear infinite}
.fx-secret .shine{background:linear-gradient(115deg,#f0f4,#0ff4,#ff04,#f0f4);background-size:300% 100%}
@keyframes sh{from{background-position:130% 0}to{background-position:-130% 0}}
.flipped.big-AR,.flipped.big-SAR,.flipped.big-secret{animation:aura 1.6s ease-in-out infinite}
.flipped.big-AR .inner,.flipped.big-SAR .inner,.flipped.big-secret .inner{transform:rotateY(540deg);transition-duration:2s;transition-timing-function:cubic-bezier(.2,.8,.2,1)}
.big-AR{--c:#4ff}.big-SAR{--c:#ffd34d}.big-secret{--c:#f6f}
@keyframes aura{50%{filter:drop-shadow(0 0 38px var(--c)) drop-shadow(0 0 80px var(--c))}0%,100%{filter:drop-shadow(0 0 16px var(--c))}}
.sp{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;opacity:0;animation:sp 1.6s ease-out forwards;pointer-events:none}
@keyframes sp{20%{opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.info{min-height:110px;margin-top:16px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#0007;font-weight:700;margin:6px 0}
.t-AR{color:#6ff}.t-SAR{color:#ffd34d}.t-secret{color:#f9f}.t-double{color:#ff9}.t-holo{color:#9df}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:8px}.th{width:48px}
.sum{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px}.sum .tc{width:150px;cursor:default}
#modal{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mb{background:var(--pn);border-radius:16px;padding:22px;max-width:760px;width:100%;position:relative;display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.mb img{width:min(300px,100%);border-radius:10px}.mb .x{top:10px;right:10px}
table{border-collapse:collapse}td,th{padding:5px 9px;border-bottom:1px solid #fff2;text-align:left}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:20px;z-index:50;font-weight:600;max-width:90vw}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* v2 : booster réaliste, dos de carte, holo, marché */
.pack{width:230px;height:360px;filter:drop-shadow(0 18px 30px #000a)}
.pack .body{inset:0;border-radius:14px;background:linear-gradient(115deg,#1b2f8f,#6a2fb5 45%,#e63946 75%,#ffcb05);overflow:hidden;color:#fff;text-shadow:0 2px 4px #000a}
.pack .body::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#fff8 50%,transparent 65%);background-size:250% 100%;animation:sh 3s linear infinite;mix-blend-mode:overlay;pointer-events:none}
.pack .top,.pack .bot{position:absolute;left:0;right:0;height:26px;z-index:2;background:repeating-linear-gradient(90deg,#f4f4f4 0 3px,#8e8e8e 3px 6px);border-radius:14px 14px 0 0}
.pack .bot{bottom:0;top:auto;border-radius:0 0 14px 14px}
.ball{width:46px;height:46px;border-radius:50%;border:4px solid #111;background:linear-gradient(#e63946 46%,#111 46% 54%,#fff 54%);box-shadow:0 0 14px #fff8}
.burst{position:absolute;inset:-60px;background:radial-gradient(circle,#fff 0,#ffcb05aa 30%,transparent 65%);opacity:0;z-index:3;pointer-events:none}
.pack.tear .burst{animation:bu .9s .3s forwards}@keyframes bu{50%{opacity:1;transform:scale(1.4)}to{opacity:0;transform:scale(2)}}
.back{background:radial-gradient(circle,#fff 0 6%,#111 6.5% 9%,#e63946 9.5% 19%,transparent 19.5%),radial-gradient(circle,#2f56d6,#1a2470 75%);border:7px solid #e8a317}
.flip{border-radius:4.5%;transition:transform .15s;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.flip:not(.flipped){box-shadow:6px 6px 0 -1px #1a2470,12px 12px 0 -2px #11185a}
.front::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fff9,transparent 50%),linear-gradient(115deg,#f0f6,#0ff6,#ff06,#f0f6);mix-blend-mode:color-dodge}
.flipped:hover .front::after{opacity:.5}
.fx-holo .shine,.fx-double .shine{opacity:.7;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 35%,#fff9 50%,transparent 65%);background-size:260% 100%;animation:sh 2.6s linear infinite}
.cw{animation:fi .8s}.cw.shake{animation:shake .12s infinite}@keyframes fi{from{filter:brightness(4)}}
.mk .tc{cursor:default;font-size:12px}.mk .tc button{width:100%;margin-top:4px;padding:5px;font-size:12px}
.mk .tc small{display:block}

/* v3 : noir / blanc / rouge, classeurs, dos de carte, god pack */
:root{--bg:#0a0a0a;--pn:#151515;--ac:#e10600;--tx:#fff;--mu:#9b9b9b}
body{background:#0a0a0a;font-family:"SF Pro Display","Helvetica Neue",Arial,sans-serif}
header{background:#000;border-bottom:3px solid var(--ac);backdrop-filter:none}
h1{color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;letter-spacing:-.3px}
.pbl{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid #fff;margin-right:10px;background:radial-gradient(circle,#fff 0 16%,#111 17% 28%,transparent 29%),linear-gradient(#e10600 45%,#111 45% 55%,#fff 55%)}
button{background:var(--ac);color:#fff;border-radius:6px}
button.g{background:#1b1b1b;color:#fff;border:1px solid #333}button.g:hover{border-color:#fff}
button.on{outline:0;background:#fff;color:#000;border-color:#fff}
select,input[type=text]{background:#1b1b1b;color:#fff;border:1px solid #333;border-radius:6px}
.coins{background:#1b1b1b;border:1px solid #333;border-radius:6px}
.set{background:#121212;border:1px solid #2a2a2a;border-radius:8px}.set:hover{border-color:var(--ac)}
.pb i{background:var(--ac)}.err{background:#2a0000;border:1px solid var(--ac)}
#stage{background:rgba(4,4,4,.97)}.mb{background:#121212;border:1px solid #2a2a2a}
footer{border-top:1px solid #222}
.crumb{font-size:22px;font-weight:800;margin:0 0 14px}.crumb a{color:var(--mu);cursor:pointer;font-weight:500}.crumb a:hover{color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;margin-bottom:22px}
.binder{background:#161616;border-left:12px solid var(--ac);border-radius:4px 12px 12px 4px;padding:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;box-shadow:5px 6px 0 #000,0 0 0 1px #2a2a2a;transition:transform .15s}
.binder:hover{transform:translateY(-4px)}.binder img{height:60px;max-width:90%;object-fit:contain}.binder small{color:var(--mu)}
.page{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#111;border:1px solid #2a2a2a;border-left:22px dotted #333;padding:16px;max-width:560px;margin:0 auto 14px;border-radius:8px}
.pocket{position:relative;cursor:pointer;border-radius:6px;background:#ffffff0a;border:1px dashed #333;text-align:center;font-size:11px}
.pocket img,.pocket .ph{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:5px;display:block}
.pocket.empty img{filter:grayscale(1);opacity:.22}.pocket.empty .ph{opacity:.35}
.pv{display:block;padding:3px;color:var(--mu)}
.x2{position:absolute;top:4px;right:4px;background:var(--ac);border-radius:10px;padding:1px 7px;font-style:normal;font-weight:700;font-size:11px}
.back,.cb{background:radial-gradient(circle at 50% 50%,transparent 0 21%,#0b1a5e 22%,transparent 60%),conic-gradient(from 20deg at 50% 50%,#1e3fb0,#4a78e8,#1e3fb0,#10206e,#1e3fb0,#4a78e8,#1e3fb0);border:7px solid #e8a317;border-radius:4.5%;position:absolute}
.back::after,.cb::after{content:"";position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #111;background:radial-gradient(circle,#fff 0 12%,#111 13% 20%,transparent 21%),linear-gradient(#e10600 46%,#111 46% 54%,#fff 54%);box-shadow:0 0 0 7px #ffffff44,0 0 24px #000a}
.dos .back,.dos .cb{background:url(dos.png) center/cover;border:0}.dos .back::after,.dos .cb::after{display:none}
.back{inset:0}
.setname{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}.setname img{height:60px}
.deck{width:230px;aspect-ratio:63/88;position:relative;margin:0 auto 18px;cursor:pointer;animation:fl 3s ease-in-out infinite}
.cb{inset:0;transform:translate(calc(var(--i)*3px),calc(var(--i)*-3px));box-shadow:0 8px 20px #000a}
.deck.tear{animation:none}.deck.tear .cb{animation:fan 1s ease-in-out forwards}
@keyframes fan{35%,70%{transform:translateX(calc((var(--i) - 2)*80px)) rotate(calc((var(--i) - 2)*12deg))}100%{transform:scale(1.05);opacity:.8}}
.deck.tear .burst{animation:bu .9s .4s forwards}.deck .burst{inset:-80px}
.godb{font-size:clamp(34px,8vw,72px);font-weight:900;text-align:center;color:#fff;text-shadow:0 0 30px var(--ac),0 0 60px var(--ac);animation:gp .5s infinite alternate}
.godb small{display:block;font-size:18px;font-weight:600;margin-top:12px}
@keyframes gp{to{transform:scale(1.08);text-shadow:0 0 50px #fff,0 0 90px var(--ac)}}

/* v4 : dos neutre (remplacé par dos.png si présent), boutique */
.back,.cb{background:linear-gradient(145deg,#232323,#050505);border:7px solid #444}
.back::after,.cb::after{display:none}
.dos .back,.dos .cb{background:var(--dos) center/cover;border:0}
.sets{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.buy{display:grid;gap:6px;width:100%}.buy button{font-size:12px;padding:6px}
/* v5 : ouverture de gauche à droite */
.deck.tear .cb{animation-delay:calc(var(--i)*.16s)}
.deck.tear .burst{animation-delay:1.1s}

/* v6 : pile à gauche, stock limité */
.rrow{display:flex;align-items:center;gap:24px}
.pile{position:relative;width:110px;height:230px;flex:none}
.pc{position:absolute;left:calc(var(--k)*6px);top:calc(var(--k)*16px);width:110px;transform:rotate(calc(var(--k)*-2deg));box-shadow:0 4px 12px #000a;border-radius:5px;overflow:hidden}
.pc:last-child{animation:toleft .6s ease-out}
@keyframes toleft{from{transform:translate(260px,40px) scale(2.4);opacity:.6}}
.lim{color:var(--ac);font-weight:700}.buy button:disabled{opacity:.3;cursor:not-allowed}

/* v7 : accueil, rail, marché, salon */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
.rail .set{flex:0 0 250px;scroll-snap-align:start}
.set .ball{width:56px;height:56px;border-radius:50%;border:4px solid #111;background:linear-gradient(#e10600 46%,#111 46% 54%,#fff 54%)}
.op{display:flex;gap:6px;width:100%}.op button{flex:1;font-size:12px;padding:6px}
.feed{height:55vh;overflow:auto;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:12px;margin-bottom:12px}
.msg{margin-bottom:10px;padding:8px 10px;background:#181818;border-radius:8px;max-width:620px}.msg.me{margin-left:auto;background:#3a0a0a}
.off{display:flex;gap:10px;margin-top:6px}.off img,.off .ph{width:70px;aspect-ratio:63/88}.off>div{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{background:#222;border:1px solid #444;border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer}
.badge{background:#fff;color:#000;border-radius:10px;padding:0 6px;margin-left:6px;font-style:normal;font-size:11px}.badge:empty{display:none}
#gs{background:#1b1b1b;color:#fff;border:1px solid #333;width:190px}
.tc.wide{grid-column:span 2}.mk .tc button{margin-top:4px}
/* moins d'animations à l'ouverture */
.inner{transition-duration:.45s}
.flipped.big-AR .inner,.flipped.big-SAR .inner,.flipped.big-secret .inner{transition-duration:1.1s}
.deck{animation:none}.deck.tear{opacity:.3;transition:opacity .3s}.deck.tear .cb,.deck.tear .burst{animation:none}
.cw{animation:none}.last .flip{animation:none}

/* Optimisation téléphone : zones tactiles, mise en page compacte et navigation fixe */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
button,select,input{min-height:42px;touch-action:manipulation}
input,select{max-width:100%;font-size:16px}
img{max-width:100%}

/* Sélecteur de boosters : sachets illustrés adaptés au tactile */
.booster-choice{position:relative;width:142px;height:205px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:3px auto 10px;padding:30px 13px 28px;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#121f53,#2f56ad 40%,#9c2235 76%,#e2a32a);border:1px solid #ffffff80;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);box-shadow:0 8px 20px #0008;color:#fff;cursor:pointer;transition:transform .18s,filter .18s}
.booster-choice::before,.booster-choice::after{content:"";position:absolute;left:0;right:0;height:13px;background:repeating-linear-gradient(90deg,#dedede 0 3px,#777 3px 6px);z-index:2}
.booster-choice::before{top:0}.booster-choice::after{bottom:0}
.booster-choice .pack-glint{position:absolute;inset:12px 0;background:linear-gradient(115deg,transparent 28%,#ffffff55 48%,transparent 57%),radial-gradient(circle at 50% 42%,#ffffff44,transparent 65%);pointer-events:none}
.booster-choice img{height:65px;max-width:105px;object-fit:contain;filter:drop-shadow(0 3px 3px #0009);position:relative;z-index:1}
.booster-choice .ball{position:relative;z-index:1}
.booster-choice strong{position:relative;z-index:1;font-size:13px;line-height:1.15;max-width:100%;text-align:center;text-shadow:0 2px 4px #000;font-weight:900}
.booster-choice .pack-edition{position:relative;z-index:1;font-size:9px;letter-spacing:1.4px;font-weight:800;text-shadow:0 1px 3px #000}
.booster-choice:hover,.booster-choice:focus-visible{transform:translateY(-5px);filter:brightness(1.15)}
.set .booster-choice{flex-shrink:0}.set .booster-choice img{height:65px}

 val:{common:4,uncommon:8,rare:20,holo:40,double:100,AR:250,SAR:600,secret:1000},

 priceById:{base1:600,base2:260,base3:240,base5:300,neo1:320,xy12:90,'sm3.5':70,'sm11.5':80,sm12:60,swsh3:40,'swsh4.5':70,swsh7:150,swsh8:35,swsh9:40,'swsh10.5':45,swsh11:40,swsh12:40,'swsh12.5':90,sv01:25,sv02:25,sv03:30,'sv03.5':90,sv04:30,'sv04.5':80,sv05:25,sv06:30,sv07:35,sv08:35,'sv08.5':220,sv09:30,sv10:35,'sv10.5b':45,'sv10.5w':45,me01:40,me02:35,ALL:15},

};

function cardSetPremium(sid){

 // Influence progressive du prix du booster, sans écraser l'écart entre raretés.
 const boosterFactor=Math.min(2.9,Math.max(.78,Math.pow(booster/65,.32)));

function pick(cards,sl=CONFIG.slots){
 const by={};cards.forEach(c=>c.tier!='unknown'&&(by[c.tier]??=[]).push(c));
 if(!Object.keys(by).length)throw Error('no data');
 const out=[];
 for(const w of sl){
  let ts=Object.keys(w).filter(t=>by[t]),wt=t=>w[t];
  if(!ts.length){ts=Object.keys(by);wt=()=>1}
  let r=Math.random()*ts.reduce((a,t)=>a+wt(t),0),t=ts[0];
  for(const k of ts){r-=wt(k);if(r<=0){t=k;break}}
  let c,n=0;do{c=by[t][Math.random()*by[t].length|0]}while(out.includes(c)&&++n<8);
  out.push(c)}
 return out}
function pm30UniqueCards(cards){
 const seen=new Set();return cards.filter(c=>{const k=String(c.id).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}
function pm30PickOne(cards,used){
 const eligible=cards.filter(c=>!used.has(c.id));
 if(!eligible.length)throw Error('Pas assez de cartes différentes');
 const c=eligible[Math.floor(Math.random()*eligible.length)];used.add(c.id);return c;
}
function pm30Draw(cards){
 const pool=pm30UniqueCards(cards),used=new Set(),out=[];
 const commons=pool.filter(c=>c.pmCommon&&!c.pmPikachu&&!c.pmEnergy);
 const pika=pool.filter(c=>c.pmPikachu);
 if(commons.length<4||pika.length!==30)throw Error('Catalogue anniversaire incomplet');
 for(let i=0;i<4;i++)out.push(pm30PickOne(commons,used));
 // 5 cartes officielles + une Énergie brillante, révélées en 6 positions.
 // Le Pikachu garanti apparaît toujours en dernier.
 const r=Math.random();let group=null,edge=0;
 for(const [rate,choose] of [
  [PM30_DROP_RATES.RGB,c=>c.pmRGB],
  [PM30_DROP_RATES.futur,c=>c.pmFutur],
  [PM30_DROP_RATES.reprint,c=>c.pmReprint],
  [PM30_DROP_RATES.SAR,c=>c.tier==='SAR'],
  [PM30_DROP_RATES.AR,c=>c.tier==='AR'],
  [PM30_DROP_RATES.double,c=>c.tier==='double']
 ]){edge+=rate;if(r<edge){group=pool.filter(choose);break}}
 if(group&&group.length)out[3]=pm30PickOne(group.filter(c=>!used.has(c.id)),used);
 out.push(PM30_ENERGY);
 out.push(pm30PickOne(pika,used));
 return out;
}

 try{
  out=anniversary?pm30Draw(cur.cards):pick(cur.cards,god?Array(6).fill(CONFIG.godSlot):undefined);
  if(god&&new Set(out.map(c=>c.id)).size!==out.length)god=false;
 }catch(e){return toast('Tirage impossible : '+e.message)}
pmPityAfter(out);tearing=true;S.stock[cur.s.id]--;S.st.open++;if(anniversary)S.st.pm30open=(S.st.pm30open||0)+1;if(god)S.st.godp++;out.filter(c=>!c.pmEnergy).forEach(c=>{S.owned[c.id]=(S.owned[c.id]||0)+1;S.meta[c.id]=mc(c)});save();
 $('#pack').classList.add('tear');
 setTimeout(()=>{tearing=false;rv={cards:out,i:0,flipped:false,busy:false,god};if(batchState){batchState.results.push({cards:out,god});batchState.done++;}god?godIntro():reveal()},350)}

/* Cadeau exceptionnel : 10 000 PokéCoins une seule fois par profil local. */
const PMS_GIFT_10K_KEY='gift_10k_2026_10';
function pmsGrant10k(){
 if(!currentUser)return;
 const a=accounts(),entry=a[currentUser];
 if(!entry)return;
 entry.game??={coins:CONFIG.start,daily:'',owned:{}};
 if(entry.game[PMS_GIFT_10K_KEY])return;

async function digest(t){if(typeof crypto!=='undefined'&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'local-'+(h>>>0).toString(16)}
async function accountSubmit(){const name=$('#auth-name').value.trim().toLowerCase(),pass=$('#auth-pass').value,a=accounts();if(!/^[a-z0-9_-]{3,22}$/.test(name))return accountView('Pseudo : 3 à 22 caractères, lettres sans accent, chiffres, _ ou -.');if(pass.length<6)return accountView('Mot de passe trop court.');const hash=await digest(name+':'+pass);if(window.authMode==='register'){if(a[name])return accountView('Ce pseudo existe déjà sur cet appareil.');a[name]={hash,game:{coins:CONFIG.start,daily:'',owned:{},stock:{ALL:10},free:Date.now(),starterGranted:true},market:{buy:[],auc:[],trd:[]},friends:[],showcase:[]};writeAccounts(a)}else if(!a[name]||a[name].hash!==hash)return accountView('Pseudo ou mot de passe incorrect.');currentUser=name;localStorage.setItem(SESSION_KEY,name);S=a[name].game||{coins:CONFIG.start,daily:'',owned:{}};if(!Number.isFinite(S.coins)||S.coins<0)S.coins=0;S.meta??={};S.mine??=[];S.stock??={};S.st??={open:0,sold:0,trades:0,godp:0};S.cl??={};S.nt??={};S.notif??=[];S.myTr??=[];S.salon??=[];S.free??=0;MK=a[name].market||{buy:[],auc:[],trd:[]};pmsGrant10k();init();}

const SOLO_DAILY=[['pack3','Ouvrir 6 boosters','open',6,180],['pack8','Ouvrir 15 boosters','open',15,450],['sell3','Vendre 8 doublons','sold',8,220],['rare2','Trouver 5 cartes rares ou mieux','rare',5,350],['spin1','Utiliser la roulette','spins',1,150],['new3','Découvrir 7 nouvelles cartes','new',7,400],['open1','Ouvrir un booster','open',1,100],['open30','Ouvrir 30 boosters','open',30,850],['sell1','Vendre un doublon','sold',1,100],['rare10day','Trouver 10 cartes rares','rare',10,700],['new1','Découvrir une nouvelle carte','new',1,100]];
const SOLO_WEEKLY=[['pack20','Ouvrir 40 boosters','open',40,1200],['sell12','Vendre 25 doublons','sold',25,900],['rare10','Trouver 22 cartes rares ou mieux','rare',22,1800],['spin5','Faire 8 tirages','spins',8,1100],['new12','Découvrir 25 nouvelles cartes','new',25,2500],['open100','Ouvrir 100 boosters','open',100,4000],['rare50week','Trouver 50 cartes rares','rare',50,3500],['new50','Découvrir 50 cartes','new',50,5000]];
const SOLOTIERS={common:1,uncommon:2,rare:4,holo:7,double:13,AR:24,SAR:60,secret:95};
function soloInit(){S.solo??={stats:{open:0,sold:0,rare:0,spins:0,new:0},day:{},week:{},claims:{},spun:0,history:[],favs:{},firsts:{}};const x=S.solo;const d=new Date().toLocaleDateString('sv-SE'),w=new Date();w.setDate(w.getDate()-((w.getDay()+6)%7));const week=w.toLocaleDateString('sv-SE');if(x.day.key!==d)x.day={key:d,stats:{open:0,sold:0,rare:0,spins:0,new:0}};if(x.week.key!==week)x.week={key:week,stats:{open:0,sold:0,rare:0,spins:0,new:0}};return x}
function soloStat(k,n=1){const x=soloInit();x.stats[k]=(x.stats[k]||0)+n;x.day.stats[k]=(x.day.stats[k]||0)+n;x.week.stats[k]=(x.week.stats[k]||0)+n}
function soloValue(c){const tier=SOLOTIERS[c.tier]||1;const id=c.sid||c.id.slice(0,c.id.lastIndexOf('-'));const cost=price(id);const extension=Math.min(4,Math.max(.8,Math.pow(cost/35,.42)));const key=String(c.id);let hash=0;for(let i=0;i<key.length;i++)hash=(hash*33+key.charCodeAt(i))>>>0;return Math.max(2,Math.round((tier*7*extension*(.90+(hash%21)/100))/2)*2)}
// Ancienneté : date de sortie de l’extension (pas date d’obtention de la carte).
// Les extensions sans date fiable gardent leur valeur normale.
const POKE_ERA_YEARS=[[/^(base|gym)/,1999],[/^neo/,2001],[/^ecard/,2002],[/^(ex|pop)/,2005],[/^dp/,2007],[/^pl/,2009],[/^(hgss|col)/,2010],[/^bw/,2012],[/^xy/,2015],[/^sm/,2018],[/^swsh/,2021],[/^sv/,2024],[/^me/,2026]];
function cardReleaseYear(c){
 const id=c.sid||String(c.id).slice(0,String(c.id).lastIndexOf('-'));
 const set=SETS.find(s=>s.id===id);
 const raw=set?.releaseDate||set?.release_date||set?.date||c.set?.releaseDate||c.set?.release_date;
 if(raw){const y=Number(String(raw).slice(0,4));if(y>=1996&&y<=new Date().getFullYear())return y;}
 const era=POKE_ERA_YEARS.find(([re])=>re.test(id));return era?era[1]:null;
}
function cardAgeMultiplier(c){
 const year=cardReleaseYear(c);if(!year)return 1;
 const age=Math.max(0,new Date().getFullYear()-year);
 // +4 % par année, avec un plafond de x2,2 pour garder une économie équilibrée.
 return Math.min(2.2,1+age*.04);
}
value=function(c){return Math.max(2,Math.round(soloValue(c)*cardAgeMultiplier(c)/2)*2)};

// Revente : 50 % de la valeur estimée, avec minimum de 1 PC par transaction.
function resaleValue(c,qty=1){return Math.max(1,Math.floor(value(c)*qty*.4))}
function soloSale(id,all=false){soloInit();const n=S.owned[id]||0;if(n<=1)return toast('Dernier exemplaire protégé.');const c=cm(id,S.meta[id]);const qty=all?n-1:1;const money=resaleValue(c,qty);S.owned[id]-=qty;S.coins+=money;S.st.sold+=qty;soloStat('sold',qty);save();solo();toast(`+${money} PC · ${qty} doublon(s) vendu(s)`)}
function soloAll(){let qty=0,money=0;const ids=Object.keys(S.owned).filter(id=>S.owned[id]>1&&S.meta[id]);for(const id of ids){const n=S.owned[id]-1;qty+=n;money+=resaleValue(cm(id,S.meta[id]),n)}if(!qty)return toast('Aucun doublon à vendre.');if(!confirm(`Vendre ${qty} doublons pour ${money} PC ? Tu gardes un exemplaire de chaque carte.`))return;for(const id of ids)S.owned[id]=1;S.coins+=money;S.st.sold+=qty;soloStat('sold',qty);save();solo();toast(`+${money} PC`)}
function solo(){soloInit();const cards=Object.keys(S.owned).filter(id=>S.meta[id]&&S.owned[id]>1).sort((a,b)=>value(cm(b,S.meta[b]))-value(cm(a,S.meta[a])));const all=cards.reduce((t,id)=>t+resaleValue(cm(id,S.meta[id]),S.owned[id]-1),0);$('#app').innerHTML=`<div class="crumb">Revente de doublons</div><section class="ky-showcase"><h2>Ton inventaire</h2><p>La rareté et l’ancienneté de l’extension influencent la valeur. Ton dernier exemplaire est toujours protégé.</p><h3>${cards.reduce((t,id)=>t+S.owned[id]-1,0)} doublons · ${all} PC</h3><button onclick="soloAll()" ${cards.length?'':'disabled'}>Tout vendre · ${all} PC</button></section><div class="cards">${cards.map(id=>{const c=cm(id,S.meta[id]);return `<div class="tc">${cimg(c)}<strong>${esc(c.name)}</strong><p class="note">${esc(TIERS[c.tier]||'Carte')} · ×${S.owned[id]} · ${resaleValue(c)} PC / doublon à la revente</p><button onclick="soloSale('${esc(id)}')">Vendre 1</button><button class="g" onclick="soloSale('${esc(id)}',true)">Vendre les ${S.owned[id]-1}</button></div>`}).join('')||'<p class="note">Aucun doublon pour le moment. Continue à ouvrir des boosters !</p>'}</div>`}

pick=function(cards,slots){
 const x=pmsProgress();const base=slots||CONFIG.slots;
 const boosted=x.charmRemaining?base.map(row=>{
   const r={...row},boost=x.activeCharm===15?2.5:x.activeCharm===10?2:0;
   for(const tier of ['rare','holo','double','AR','SAR','secret'])if(r[tier])r[tier]=boost?r[tier]+boost:r[tier]*1.75;
   return r;
 }):base;
 const by={};cards.forEach(c=>{if(c.tier!=='unknown')(by[c.tier]??=[]).push(c)});
 if(!Object.keys(by).length)throw Error('Aucune carte disponible');
 const out=[],chase=S.chase||{};
 for(const row of boosted){
   let tiers=Object.keys(row).filter(t=>by[t]?.length);if(!tiers.length)tiers=Object.keys(by);
   const sum=tiers.reduce((a,t)=>a+(row[t]||1),0);let roll=Math.random()*sum,tier=tiers[0];
   for(const t of tiers){roll-=row[t]||1;if(roll<=0){tier=t;break}}
   let pool=by[tier];if(slots&&slots.length===6&&slots.every(w=>w===CONFIG.godSlot)){const fresh=pool.filter(c=>!out.some(o=>o.id===c.id));if(fresh.length)pool=fresh;else {const allFresh=cards.filter(c=>['double','AR','SAR','secret'].includes(c.tier)&&!out.some(o=>o.id===c.id));if(allFresh.length)pool=allFresh;}}const weights=pool.map(c=>chase[c.id]?1.5:1);
   let r=Math.random()*weights.reduce((a,b)=>a+b,0),card=pool[0];

   out.push(card);
 }

};

 for(const key of ['owned','meta','chase']){

 }
 // Les missions anniversaire peuvent avoir été accomplies ou récompensées.
 const isMission=id=>/^(?:pm30|anniv30|m30th(?:-|$))/i.test(id);
 for(const key of ['cl','nt']){
  const obj=game[key];if(obj&&typeof obj==='object')for(const id of Object.keys(obj))if(isMission(id))delete obj[id];
 }
 if(game.st&&typeof game.st==='object')game.st.pm30open=0;

 for(const [id,n,cur,goal,rw] of [
 ['extraopen25','Ouvrir 25 boosters',opened,25,650],['extraopen100','Ouvrir 100 boosters',opened,100,2800],['extraopen500','Ouvrir 500 boosters',opened,500,16000],

<script>
/* Cinématique remplaçant les couches de révélation précédentes. Aucune action sur les tirages. */
let pmCinemaSequence=0;
function pmCinemaRank(c){
 if(c.pmRGB||/\bRGB\b/i.test(c.rar||''))return {name:'RGB • LÉGENDAIRE',css:'pm-label-rgb',color:'#d3c6ff',power:4};
 if(c.pmFutur||c.pmReprint)return {name:c.pmFutur?'CARTE FUTURISTE':'RÉIMPRESSION RARE',css:'pm-label-legendary',color:'#ffd577',power:3};
 if(c.tier==='secret')return {name:'HIT EXCEPTIONNEL',css:'pm-label-legendary',color:'#f6cd71',power:3};
 if(c.tier==='SAR')return {name:'ILLUSTRATION SPÉCIALE',css:'pm-label-special',color:'#eda0fb',power:3};
 if(c.tier==='AR')return {name:'ILLUSTRATION RARE',css:'pm-label-special',color:'#8bdcff',power:2};
 if(c.tier==='double')return {name:'SUPER HIT • EX',css:'',color:'#f25b6c',power:1};
 return null;
}
function pmCinemaConfetti(el,rank){
 if(!el||!rank||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const burst=document.createElement('span');burst.className='pm-cinema-burst';el.appendChild(burst);setTimeout(()=>burst.remove(),900);
 const amount=rank.power>=3?24:rank.power===2?18:12;
 for(let i=0;i<amount;i++){
  const p=document.createElement('i'),a=Math.PI*2*i/amount,d=95+Math.random()*110;
  p.className='pm-cinema-particle';p.style.setProperty('--dx',Math.round(Math.cos(a)*d)+'px');p.style.setProperty('--dy',Math.round(Math.sin(a)*d)+'px');
  p.style.animationDelay=(Math.random()*.16)+'s';el.appendChild(p);setTimeout(()=>p.remove(),1350);
 }
}
function pmCinemaSetLabel(el,rank){if(!el||!rank)return;el.innerHTML=`<span class="pm-cinema-label ${rank.css}">${rank.name}</span>`+el.innerHTML}
function pmCinemaComplete(){
 if(!rv||!rv.cinemaPending||rv.busy)return;
 const serial=++pmCinemaSequence,rank=rv.cinemaRank,stack=document.querySelector('#stage .real-stack');if(!stack)return;
 rv.cinemaPending=false;rv.busy=true;
 const curtain=stack.querySelector('.pm-cinema-curtain');if(curtain)curtain.classList.add('pm-cinema-leave');
 const info=document.querySelector('#stage .pm-cinema-info'),controls=document.querySelector('#stage .pm-cinema-controls');
 const finish=()=>{
  if(serial!==pmCinemaSequence||!rv||!stack.isConnected)return;
  stack.classList.remove('pm-cinema-pending');curtain?.remove();
  if(rank){stack.style.setProperty('--hit-glow',rank.color);stack.classList.add('pm-cinema-hit');pmCinemaConfetti(stack,rank);pmCinemaSetLabel(info,rank)}
  if(info)info.setAttribute('aria-hidden','false');
  if(controls)controls.innerHTML=`<button type="button" onclick="flipIt()">Voir le résumé →</button><button class="g" type="button" onclick="summary()">Terminer</button>`;
  setTimeout(()=>{if(serial===pmCinemaSequence&&rv)rv.busy=false},rank?850:240);
 };
 setTimeout(finish,curtain?320:0);
}
reveal=function(){
 ++pmCinemaSequence;
 if(typeof pmSuspenseTimer!=='undefined')clearTimeout(pmSuspenseTimer);
 if(typeof pmFxTimer!=='undefined')clearTimeout(pmFxTimer);
 if(batchState&&batchState.skip&&batchState.total>=5)rv.i=rv.cards.length-1;
 const c=rv.cards[rv.i],last=rv.i===rv.cards.length-1,rank=pmCinemaRank(c);
 rv.flipped=true;rv.busy=false;rv.cinemaPending=last;rv.cinemaRank=rank;
 const prefix=last?'DERNIÈRE CARTE':`CARTE ${rv.i+1} / ${rv.cards.length}`;
 const ownedNew=typeof pmNewCards==='function'&&!!pmNewCards()[c.id];
 const back=last?`<div class="pm-cinema-curtain"><span class="pm-cinema-ball"></span><b>DERNIÈRE CARTE</b></div>`:'';
 $('#stage').className='pm-cinema-stage';
 $('#stage').innerHTML=`<button class="g x" onclick="summary()">Passer</button><div class="sbox"><div class="setname"><b>${esc(cur.s.name)}</b></div><div class="pm-open-counter"><span>BOOSTER OUVERT</span><strong>${prefix}</strong><div class="pm-open-track"><i style="width:${(rv.i+1)/rv.cards.length*100}%"></i></div></div><div class="real-stack ${last?'pm-cinema-pending':''}" style="--hit-glow:${rank?.color||'#f04a59'}" onclick="flipIt()" role="button" tabindex="0" aria-label="${last?'Révéler la dernière carte':'Carte suivante'}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipIt()}"><div class="stack-back"></div><div class="stack-front fx-${c.tier}">${cimg(c,'high')}${ownedNew&&!last?'<span class="pm-cinema-new">NOUVEAU</span>':''}</div>${back}</div><div class="info pm-cinema-info" aria-hidden="${last?'true':'false'}"><b>${esc(c.name)}</b> · ${esc(TIERS[c.tier]||'Carte')} · ${value(c)} PC${ownedNew&&last?' · NOUVELLE CARTE':''}</div><div class="real-controls pm-cinema-controls">${last?'<button type="button" class="pm-main-reveal" onclick="event.stopPropagation();flipIt()">Révéler la dernière carte</button>':`<button type="button" onclick="flipIt()">Carte suivante →</button>`}<button class="g" type="button" onclick="pmEmptyPack()">Vider le paquet</button>${batchState&&batchState.total>=5?`<button class="g" type="button" onclick="toggleBatchSkip();reveal()">Dernière carte uniquement : ${batchState.skip?'ON':'OFF'}</button>`:''}</div></div>`;
 if(rank&&!last){
  const serial=pmCinemaSequence,stack=document.querySelector('#stage .real-stack');rv.busy=true;
  setTimeout(()=>{
   if(serial!==pmCinemaSequence||!rv||!stack?.isConnected)return;
   stack.classList.add('pm-cinema-hit');pmCinemaConfetti(stack,rank);pmCinemaSetLabel(document.querySelector('#stage .pm-cinema-info'),rank);
   setTimeout(()=>{if(serial===pmCinemaSequence&&rv)rv.busy=false},650);
  },130);
 }
};
flipIt=function(){if(!rv||rv.busy)return;if(rv.cinemaPending){pmCinemaComplete();return}next()};
</script>

<script>
(function(){
  function pmSafeBalance(){try{return pmBalanceState()}catch(e){return {pityBySet:{}}}}
  function pmPityInfo(id){
    if(!id)return {count:0,remaining:PM_PITY_LIMIT,progress:0};
    const state=pmSafeBalance();
    const count=Math.max(0, Number((state.pityBySet||{})[id]||0));
    const remaining=Math.max(0, PM_PITY_LIMIT-count);
    return {count,remaining:remaining||0,progress:Math.max(0,Math.min(100,count/PM_PITY_LIMIT*100))};
  }
  function pmPityMarkup(id){
    const p=pmPityInfo(id), txt=p.remaining<=1?'Prochain booster : pity garantie':`Encore ${p.remaining} booster${p.remaining>1?'s':''} avant la pity`;
    return `<div class="pm-pity-inline"><div><strong>Pity de l’extension</strong><small>Compteur indépendant pour cette série uniquement.</small></div><div class="pm-pity-rem"><b>${p.remaining}</b><small>avant garantie</small></div><div class="pm-pity-track"><i style="width:${p.progress}%"></i></div><small>${txt}</small></div>`;
  }
  function pmSeriesBadge(s){
    if(s?.logo)return `<span class="pm-series-badge">${logo(s)}</span>`;
    return `<span class="pm-series-badge pm-series-text">${esc(s?.name||'Série')}</span>`;
  }
  function pmChanceBucket(card){
    if(!card)return 0;
    if(card.pmRGB||/\bRGB\b/i.test(card.rar||''))return 0.0045;
    if(card.pmFutur)return 0.010;
    if(card.pmReprint)return 0.016;
    if(card.tier==='secret')return 0.002;
    if(card.tier==='SAR')return 0.006;
    if(card.tier==='AR')return 0.020;
    if(card.tier==='double')return 0.080;
    return 0;
  }
  function pmChanceOfCard(card,setId){
    if(!card)return 0;
    const cards=(cache?.[setId]?.cards)||[];
    let pool=[];
    if(card.pmRGB||/\bRGB\b/i.test(card.rar||'')) pool=cards.filter(c=>c.pmRGB||/\bRGB\b/i.test(c.rar||''));
    else if(card.pmFutur) pool=cards.filter(c=>c.pmFutur);
    else if(card.pmReprint) pool=cards.filter(c=>c.pmReprint);
    else pool=cards.filter(c=>c.tier===card.tier);
    const bucket=pmChanceBucket(card);
    const n=Math.max(1,pool.length||1);
    let chance=bucket/n;

  };
  renderShowcase=function(){
    const rail=$('#ky-carousel'),details=$('#ky-selected');if(!rail||!details||!showcaseSets.length)return;

<script>
/* Rates are category probabilities PER PACK, mirroring the 30th anniversary.
   Categories not in a set are not redistributed into other hits. */
(function(){
 const PM_STANDARD_RATES={double:0.08,AR:0.02,SAR:0.006,secret:0.001};
 function pmSetId(){return cur?.s?.id==='ALL'?(window.PM_FEATURED_ID||cur?.s?.id):cur?.s?.id;}
 function pmOne(pool,excluded){const ok=pool.filter(c=>!excluded.has(c.id));const list=ok.length?ok:pool;return list[Math.floor(Math.random()*list.length)];}
 function pmChooseBase(pool,used,types){const p=pool.filter(c=>types.includes(c.tier)&&!used.has(c.id));return p.length?pmOne(p,used):pmOne(pool.filter(c=>!used.has(c.id)),used);}
 function pmNewStandardDraw(cards){
   const p=cards.filter(c=>c.tier!=='unknown'),base=p.filter(c=>['common','uncommon','rare','holo'].includes(c.tier));
   if(!base.length)return pmPreviousStandardPick(cards); // Compatibility with unusual legacy extensions.
   const used=new Set(),out=[];
   const layout=[['common'],['common'],['common','uncommon'],['uncommon','common'],['uncommon','rare','holo']];
   for(const t of layout){const c=pmChooseBase(base,used,t);if(c){out.push(c);used.add(c.id)}}
   const r=Math.random();let edge=0,group=null;
   for(const tier of ['secret','SAR','AR','double']){
     edge+=PM_STANDARD_RATES[tier];
     if(r<edge){group=p.filter(c=>c.tier===tier&&!used.has(c.id));break}
   }
   // If a tier does not exist, the slot stays a regular card, not a different hit.
   const last=group?.length?pmOne(group,used):pmChooseBase(base,used,['rare','holo','uncommon','common']);
   if(last)out.push(last);
   return out;
 }
 const pmPreviousStandardPick=pick;
 pick=function(cards,slots){
   const id=pmSetId();
   if(!id||id==='30th'||id==='ALL'||slots&&slots!==CONFIG.slots) return pmPreviousStandardPick(cards,slots);
   let out=pmNewStandardDraw(cards);
   const b=pmBalanceState(),before=b.pityBySet?.[id]||0;
   if(before>=PM_PITY_LIMIT-1&&!out.some(c=>c.tier==='double')){
     const options=cards.filter(c=>c.tier==='double'&&!out.some(x=>x.id===c.id));
     if(options.length)out[out.length-1]=pmOne(options,new Set());
   }
   return pmEnsureNew(out,cards,id,0);
 };
 // The anniversary rate is unchanged; keep its own profile counter and EX pity.
 const previousAnniversary=pm30Draw;
 pm30Draw=function(cards){
   let out=previousAnniversary(cards);
   const pity=pmBalanceState().pityBySet?.['30th']||0;
   if(pity>=PM_PITY_LIMIT-1&&!out.some(c=>c.tier==='double')){
     const pool=pm30UniqueCards(cards).filter(c=>c.tier==='double'&&!c.pmPikachu&&!c.pmEnergy&&!out.some(x=>x.id===c.id));
     if(pool.length)out[3]=pmOne(pool,new Set());
   }
   return out;
 };
 // Avoid an old delayed animation modifying a new pack after navigation.
 const prevCloseStage=closeStage;
 closeStage=function(){
   if(typeof pmCinemaSequence!=='undefined')pmCinemaSequence++;
   if(typeof pmSuspenseTimer!=='undefined')clearTimeout(pmSuspenseTimer);
   if(typeof pmFxTimer!=='undefined')clearTimeout(pmFxTimer);
   tearing=false;
   prevCloseStage();
 };
 // Explicit end-of-pack control for multiples, rather than an automatic screen jump.
 const prevSummary=summary;
 summary=function(){
   if(!batchState)return prevSummary();
   const b=batchState;
   if(b.done>=b.total)return batchNext();
   const latest=rv?.cards||[];
   $('#stage').className='';
   $('#stage').innerHTML=`<div class="sbox"><h2>Booster ${b.done} / ${b.total} terminé</h2><p>${latest.length} cartes ajoutées à la collection.</p><div class="sum">${latest.map(c=>`<div class="tc">${cimg(c)}<small>${esc(c.name)}</small></div>`).join('')}</div><div class="pm-safe-next"><button type="button" onclick="batchNext()">Ouvrir le booster ${b.done+1} →</button><button class="g" type="button" onclick="closeStage()">Arrêter</button></div></div>`;
 };
})();
</script>

function matchFr(c,sets,en){const candidates=sets[isClassic(c)?'fr:30ccc':'fr:30c']||[]; if(isRGB(c)){const color=String(c.localId||'').charAt(0).toUpperCase(); return candidates.find(x=>/mew/i.test(x.name||'')&&(String(x.localId||'').toUpperCase().includes(color)||String(x.id||'').toUpperCase().endsWith('_'+color)))||null;} if(isClassic(c)){const name=cleanName(c.name); const direct=candidates.filter(x=>cleanName(x.name)===name); if(direct.length===1)return direct[0]; if(!en)return null; const sameNum=candidates.filter(x=>(digitsNo(x)||cardNo(x))===(digitsNo(en)||cardNo(en))); if(sameNum.length!==1)return null; const fr=sameNum[0], artistA=cleanName(fr.illustrator),artistB=cleanName(en.illustrator), dexA=dex(fr),dexB=dex(en); if((artistA&&artistB&&artistA===artistB)||(dexA&&dexA===dexB))return fr; return null;} const n=digitsNo(c)||cardNo(c), same=candidates.filter(x=>(digitsNo(x)||cardNo(x))===n); return same.length===1?same[0]:null;}

{url,lang:'ja',source:'tcgdex'})));} return val;}
async function concurrent(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const item=items[i++];try{await fn(item)}catch(e){console.warn('30th image',item?.id,e)}}}))}
